metadata:
  id: "model-evaluation-framework"
  title: "AI Model Evaluation Framework"
  category: "ai-tools"
  version: "1.0"
  created: "2026-01-30"

description: "Design a rigorous testing framework for selecting an AI model for production applications with test queries, scoring rubrics, and comparison frameworks."

prompt_text: |
  You are an AI model evaluation specialist. Help me design a rigorous testing framework for selecting an AI model for production use.

  MY APPLICATION:
  - Use case: [describe your application - e.g., "SEO analysis chat with tool calling"]
  - Key requirements: [list 3-5 requirements - e.g., "numeric accuracy, tool reliability, <5s response time"]
  - Volume: [expected requests per day/month]
  - Budget: [target cost per request or monthly budget]

  DELIVERABLES NEEDED:

  1. TEST QUERY DESIGN
     - Design 6-8 test queries that stress-test my requirements
     - Include "positive" tests (model should do X)
     - Include "negative" tests (model should NOT do Y)
     - Cover edge cases specific to my use case

  2. SCORING RUBRIC
     - Quantitative metrics to collect (tokens, latency, cost)
     - Qualitative criteria with 1-5 scoring definitions
     - Disqualifying failure conditions

  3. MODEL SHORTLIST
     - Recommend 4-6 models to test based on my requirements
     - Include pricing for each
     - Note any known limitations relevant to my use case

  4. TESTING PROCEDURE
     - Step-by-step testing protocol
     - Data collection templates
     - Comparison framework

  Format the output as a ready-to-execute evaluation plan.

  ---
  Prompt by Brass-SEO (brass-seo.com)
  ---

usage:
  - "Replace [bracketed placeholders] with your application details"
  - "Paste into ChatGPT, Claude, or any AI assistant"
  - "Use the generated framework to systematically test models"
  - "Document results for each model using the scoring rubric"

placeholders:
  - name: "[describe your application]"
    description: "Your application type and primary function"
  - name: "[list 3-5 requirements]"
    description: "Critical requirements like accuracy, speed, cost"
  - name: "[expected requests per day/month]"
    description: "Your usage volume"
  - name: "[target cost per request or monthly budget]"
    description: "Your budget constraints"

expected_output: "A complete evaluation plan with test queries, scoring rubric, model shortlist, and testing procedure"

tips:
  - "Be specific about your tool calling requirements if applicable"
  - "Include your actual test data examples if possible"
  - "Run the same queries against each model for fair comparison"
  - "Test over multiple sessions to catch inconsistencies"

resources:
  website: "https://brass-seo.com"
  guide: "https://brass-seo.com/ai-prompts-guide-for-seo"
  blog_post: "https://brass-seo.com/blog/ai-model-evaluation-production-apps"
