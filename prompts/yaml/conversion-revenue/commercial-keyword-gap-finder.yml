metadata:
  id: "commercial-keyword-gap-finder"
  title: "Commercial Keyword Gap Finder"
  category: "conversion-revenue"
  version: "1.0"
  created: "2026-08-04"

description: "Finds high-commercial-intent keywords a site has topical coverage for but no dedicated page targeting them."

prompt_text: |
  Find high-commercial-intent keywords my site has topical coverage for but no dedicated page targeting them:

  Site: [site URL]
  Existing Content Topics: [list your main content topics/categories]
  GSC Query Data: [paste queries the site already gets impressions for]
  What The Site Sells: [product/service description]

  Identify keywords that meet ALL of these:

  1. Show clear commercial or transactional intent
  2. The site already ranks for or gets impressions on a related informational query
  3. There's no existing page whose primary purpose is to capture that specific commercial query

  For each gap found, report:
  - The keyword and its intent signal
  - The existing informational content it's adjacent to
  - A suggested page type and working title
  - Priority (based on how directly it connects to what the site sells)

  Finish with the top 3 gaps to build first.

  ---
  Prompt by Brass-SEO (brass-seo.com)
  ---

usage:
  - "List your main content topics or categories in a few words each"
  - "Export GSC queries the site already gets impressions for"
  - "Add a short description of what the site actually sells"

placeholders:
  - name: "[site URL]"
    description: "The site being analyzed"
  - name: "[list your main content topics/categories]"
    description: "Existing content topics"
  - name: "[paste queries the site already gets impressions for]"
    description: "GSC query data"
  - name: "[product/service description]"
    description: "What the site sells"

expected_output: "A list of commercial keyword gaps, each with intent signal, adjacent informational content, suggested page type/title, priority, and a top-3 build-first list."

tips:
  - "Pair with the Keyword Intent Tier Classifier to confirm the tier before building a page"
  - "Recheck after every major content push"

resources:
  website: "https://brass-seo.com"
  guide: "https://brass-seo.com/ai-prompts-guide-for-seo"
  related_prompts:
    - "keyword-intent-tier-classifier"
