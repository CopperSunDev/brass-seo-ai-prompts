metadata:
  id: "content-pruning-candidate-finder"
  title: "Content Pruning Candidate Finder"
  category: "content-maintenance"
  version: "1.0"
  created: "2026-08-04"

description: "Finds pages worth pruning without losing the SEO equity they've built, checking backlinks before recommending removal."

prompt_text: |
  Find pages worth pruning without losing the SEO equity they've built:

  Site: [site URL]
  GSC Data: [12-month traffic export for all indexed pages]
  Site Section Context: [what parts of the site are core vs. peripheral]

  Flag pages as PRUNING CANDIDATES if they meet BOTH:
  1. Near-zero organic traffic over the full period (default threshold: under 5 clicks/month)
  2. No meaningful internal links pointing to them from higher-traffic pages

  For each candidate, determine:
  - Does it have any backlinks?
  - Is there a live, related page it should 301 redirect to?
  - Is it safe to fully remove with no redirect?

  Output a table: URL, traffic, backlinks (yes/no if known), recommended action, and reasoning.

  ---
  Prompt by Brass-SEO (brass-seo.com)
  ---

usage:
  - "Export 12 months of GSC traffic for all indexed pages"
  - "Note which sections of the site are core vs. peripheral"
  - "Paste in"

placeholders:
  - name: "[site URL]"
    description: "The site being audited"
  - name: "[12-month traffic export for all indexed pages]"
    description: "GSC traffic export"
  - name: "[what parts of the site are core vs. peripheral]"
    description: "Business context on which sections matter most"

expected_output: "A table of pruning candidates with traffic, backlink status, recommended action (redirect/delete/keep), and reasoning."

tips:
  - "Always check backlinks before deleting - a zero-traffic page can still carry equity worth redirecting"
  - "Pair with the Redirect Mapping Assistant once candidates are confirmed"

resources:
  website: "https://brass-seo.com"
  guide: "https://brass-seo.com/ai-prompts-guide-for-seo"
  related_prompts:
    - "redirect-mapping-assistant"
