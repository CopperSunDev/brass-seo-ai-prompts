metadata:
  id: "comprehensive-site-audit"
  title: "Comprehensive Site Audit"
  category: "technical-seo"
  version: "1.0"
  created: "2026-01-14"

description: "Analyze any website for technical SEO issues with prioritized recommendations and severity levels."

prompt_text: |
  Analyze [website URL] for technical SEO issues. Provide a comprehensive audit covering:

  1. CRAWLABILITY
     - robots.txt configuration and potential issues
     - XML sitemap presence, validity, and completeness
     - Internal linking structure and orphan pages
     - JavaScript rendering requirements

  2. INDEXATION
     - Meta robots tags usage
     - Canonical tag implementation
     - Duplicate content issues
     - Index bloat from parameter URLs

  3. SITE SPEED
     - Core Web Vitals estimates (LCP, FID/INP, CLS)
     - Page load time factors
     - Image optimization opportunities
     - Render-blocking resources

  4. MOBILE-FRIENDLINESS
     - Responsive design implementation
     - Mobile usability issues
     - Touch target sizes
     - Viewport configuration

  5. HTTPS & SECURITY
     - SSL certificate status
     - Mixed content issues
     - HTTP to HTTPS redirects
     - Security headers

  6. STRUCTURED DATA
     - Schema markup presence
     - Implementation errors
     - Missing opportunities

  For each issue found, provide:
  - Severity level (Critical, High, Medium, Low)
  - Specific location/URL affected
  - Recommended fix
  - Expected impact on rankings

  Prioritize issues by potential SEO impact.

  ---
  Prompt by Brass-SEO (brass-seo.com)
  ---

usage:
  - "Replace [website URL] with the site you want to audit"
  - "Paste the prompt into ChatGPT or Claude"
  - "For best results, also provide Google Search Console data"

placeholders:
  - name: "[website URL]"
    description: "The full URL of the website to audit (e.g., https://example.com)"

expected_output: "A structured audit report with categorized issues, severity levels, specific recommendations, and a prioritized fix list."

tips:
  - "Run this audit quarterly for ongoing sites"
  - "Combine with PageSpeed Insights data for more accurate speed analysis"
  - "Use with Google Search Console coverage report for indexation issues"
  - "For large sites, consider auditing section by section"

resources:
  website: "https://brass-seo.com"
  guide: "https://brass-seo.com/ai-prompts-guide-for-seo"
  related_prompts:
    - "core-web-vitals-analysis"
